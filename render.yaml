# Optional one-click deploy on Render.com (free web service + free PostgreSQL).
# Push this folder to GitHub, then on Render: New > Blueprint > select the repo.
services:
  - type: web
    name: jansetu
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: demo
      - key: DATABASE_URL
        fromDatabase: { name: jansetu-db, property: connectionString }
databases:
  - name: jansetu-db
    plan: free
